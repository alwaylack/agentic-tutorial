name: Deploy to Cloudflare Pages (direct upload)

# 兜底方案：绕过 CF 的 Git 集成，构建后用 wrangler 直接上传
# 需要在仓库 Secrets 中配置：
#   CLOUDFLARE_API_TOKEN  —— CF API Token（权限：Cloudflare Pages Edit）
#   CLOUDFLARE_ACCOUNT_ID —— CF 账户 ID（Dashboard 首页右侧可见）

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm clean-install

      - run: npx vitepress build docs

      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/.vitepress/dist --project-name=agentic-tutorial --branch=main --commit-dirty=true

      # 直传部署可能停留在 queued 状态导致生产别名不前移；
      # 从最近 5 个部署里找到含 askai-fab 的最新一个，用 rollback API 强制激活
      - name: Force activate latest good deployment
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/agentic-tutorial/deployments"
          curl -s -H "Authorization: Bearer $CF_TOKEN" "$API" > deps.json
          DEP_ID=$(python3 -c "
          import json, subprocess
          deps = json.load(open('deps.json'))['result'][:5]
          for x in deps:
              html = subprocess.run(['curl', '-s', '--max-time', '30', x['url'] + '/'], capture_output=True, text=True).stdout
              if 'askai-fab' in html:
                  print(x['id'])
                  break
          ")
          echo "Activating: $DEP_ID"
          test -n "$DEP_ID"
          curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" "$API/$DEP_ID/rollback"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
